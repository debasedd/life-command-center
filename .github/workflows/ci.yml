name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

# Never let a build job block the required cron workflow.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # The build must never depend on real secrets; provide harmless
          # placeholders so `next build` can prerender without a live DB.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          SESSION_SECRET: ci-placeholder-session-secret
          CRON_SECRET: ci-placeholder-cron-secret

      - name: Audit dependencies (high/critical only)
        run: npm audit --audit-level=high || true